name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          if [ -f site.zip ]; then
            unzip -q site.zip -d _site
          else
            rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          fi
          touch _site/.nojekyll
          echo "Files in site root:" && ls -A _site
          test -f _site/index.html || (echo "index.html missing from site root" && exit 1)
          test -f _site/assets/css/style.css || (echo "assets/css/style.css missing: folders were not preserved" && exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
